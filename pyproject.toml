[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmpu"
version = "0.6.2"
description = "Large Language Model Processing Unit"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "yzITI" }, { name = "Phantomlsh" }]
dependencies = [
    "google-genai",
    "anthropic",
    "openai",
    "pyyaml",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/yzITI/llmpu"
Repository = "https://github.com/yzITI/llmpu"

[tool.setuptools.packages.find]
include = ["llmpu*"]
